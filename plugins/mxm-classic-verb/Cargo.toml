[package]
name = "mxm-classic-verb"
description = "An everyday algorithmic reverb whose spaces can be fitted from impulse responses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug.workspace = true
nice-plug-egui.workspace = true
mxm-ui.workspace = true
mxm-preset.workspace = true
mxm-tempo.workspace = true
egui.workspace = true
mxm-classic-verb-dsp.workspace = true
# In-plugin loading (plan §5.2): the fitter runs on the background task, never in `process()`.
mxm-classic-verb-fit.workspace = true
# The same pins `mxm-creative-sampler` already carries, so the lock gains no new versions.
hound = "=3.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
# The collection's shared headless checks (`crates/mxm-plugin-test`).
mxm-plugin-test.workspace = true
# `wgpu` renders a frame to pixels for the layout-tree review pictures
# (`mxm_plugin_test::tree_checks`, `editor::tests::tree_pictures`). Test-only: nothing here reaches
# the bundle.
egui_kittest = { version = "=0.36.1", features = ["wgpu"] }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
