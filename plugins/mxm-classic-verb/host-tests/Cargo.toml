[package]
name = "mxm-classic-verb-host-tests"
description = "mxm-classic-verb hosted by MXM Player: effect chain through the real host, against its release bundle. The slow tier: `cargo test -p mxm-classic-verb` never builds the player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# The tests are in `tests/`; the library is empty and not test-built.
test = false
doctest = false

[dev-dependencies]
mxm-player.workspace = true
mxm-player-harness.workspace = true
